[project]
name = "waha-fast-mcp"
version = "0.1.0"
description = "Fast, single-module MCP server exposing WAHA (WhatsApp HTTP API) to AI agents and LangChain"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["mcp", "waha", "whatsapp", "langchain", "ai-agents", "agents"]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.24.0,<2.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
examples = [
    "langchain>=1.0.0",
    "langchain-core",
    "langchain-mcp-adapters>=0.2.0",
    "langchain-openai>=0.3.0",
    "langchain-openrouter>=0.2.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.9.0",
]

[project.scripts]
waha-fast-mcp = "waha_fast_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/waha_fast_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"SKILL.md" = "waha_fast_mcp/SKILL.md"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "live: requires WAHA_LIVE=1 and a running WAHA instance",
]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [".venv", "chrome-agent-mcp-light", "dist", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
